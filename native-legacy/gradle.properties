# --- JVM / build performance ---
# This VM has 2 cores and a shared memory budget, and the cgroup OOM killer has
# already killed a build here. Keep the build to ONE JVM: in-process Kotlin
# compilation avoids the extra Kotlin daemon JVM entirely.
# The shared VM's memory cgroup has killed this build twice, so the budget is
# deliberately small: a single JVM, serial GC (far fewer GC threads), and
# in-process Kotlin compilation. Build one module at a time.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# KSP (Room's annotation processor) still registers its generated sources through
# the `kotlin.sourceSets` DSL, which AGP 9's built-in Kotlin forbids by default.
# Google documents this exact opt-out for annotation processors that have not yet
# migrated to the `android.sourceSets` DSL.
android.disallowKotlinSourceSets=false

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin ---
kotlin.code.style=official
