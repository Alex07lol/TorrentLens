# The cloud VM runs under a small memory cgroup whose OOM killer has already
# killed this build (once during Dart kernel compilation). The Flutter template
# default of -Xmx8G is unusable here; the build is constrained to ONE small JVM
# with in-process Kotlin compilation and no daemon.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=false
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
